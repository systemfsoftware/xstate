# Mergify: policy lives in systemfsoftware/.github (.mergify.yml). This file only names this repo's CI checks.
extends: .github
queue_rules:
  # Checked on the PR itself before it enters the queue.
  - name: subtree
    merge_method: merge
    queue_conditions:
      # Recognised from the commits themselves: both anchored git-subtree trailer
      # lines must be present (ruling 9, SYS-1246). Same checks as default.
      - "commits[*].commit_message ~= (?m)^git-subtree-dir: \\S+$"
      - "commits[*].commit_message ~= (?m)^git-subtree-split: [0-9a-f]{40}$"
      - check-success = check (dist)
      - check-success = check (format)
      - check-success = check (lint)
      - check-success = check (test)
      - check-success = check (typecheck)
      - or:
          - check-success = lint PR commits
          - check-skipped = lint PR commits
      - or:
          - check-success = a publishable-package change needs an intent
          - check-skipped = a publishable-package change needs an intent
    # Checked on Mergify's queue draft PR (mergify/merge-queue/*), i.e. CI on the PR rebased with main and any batch.
    merge_conditions:
      - check-success = check (dist)
      - check-success = check (format)
      - check-success = check (lint)
      - check-success = check (test)
      - check-success = check (typecheck)

  - name: default
    # Checked on the PR itself before it enters the queue.
    queue_conditions:
      - "-commits[*].commit_message ~= (?m)^git-subtree-dir: \\S+$"
      - not:
          and:
            - "title ~= (?i)(?<![\\w.-])(add|pull|update|sync|vendor|vendored|vendoring|refresh|import|bump|upgrade)(?!\\.?[\\w-])"
            - "title ~= (?i)(?<![\\w.-])subtrees?(?!\\.?[\\w-])"
            - or:
                - "added-files ~= ^(vendor|vendored|third[_-]party|external|repos|subtrees?)/"
                - "modified-files ~= ^(vendor|vendored|third[_-]party|external|repos|subtrees?)/"
      # Vendored subtree prefixes in this repo: hand edits without trailers cannot merge.
      - not:
          or:
            - "added-files ~= ^(repos/constitution|repos/worktrunk-scripts|repos/xstate-upstream)/"
            - "modified-files ~= ^(repos/constitution|repos/worktrunk-scripts|repos/xstate-upstream)/"
      - check-success = check (dist)
      - check-success = check (format)
      - check-success = check (lint)
      - check-success = check (test)
      - check-success = check (typecheck)
      - or:
          - check-success = lint PR commits
          - check-skipped = lint PR commits
      - or:
          - check-success = a publishable-package change needs an intent
          - check-skipped = a publishable-package change needs an intent
    # Checked on Mergify's queue draft PR (mergify/merge-queue/*), i.e. CI on the PR rebased with main and any batch.
    merge_conditions:
      - check-success = check (dist)
      - check-success = check (format)
      - check-success = check (lint)
      - check-success = check (test)
      - check-success = check (typecheck)
