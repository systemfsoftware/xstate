version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    labels:
      - "automerge"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: "increase"
    open-pull-requests-limit: 20
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@systemfsoftware/arethetypeswrong-cli"
      - dependency-name: "@systemfsoftware/conformance-spec"
      - dependency-name: "@systemfsoftware/effect-cell-types"
      - dependency-name: "@systemfsoftware/effect-gherkin-spec"
      - dependency-name: "@systemfsoftware/effect-schema-discovery"
      - dependency-name: "@systemfsoftware/effect-schema-law"
      - dependency-name: "@systemfsoftware/effect-schema-recursion-budget"
      - dependency-name: "@systemfsoftware/effect-schema-vite"
      - dependency-name: "@systemfsoftware/effect-sim-kernel"
      - dependency-name: "@systemfsoftware/effect-spec-runtime"
      - dependency-name: "@systemfsoftware/oxlint-config-cell-architecture"
      - dependency-name: "@systemfsoftware/oxlint-config-dmmf"
      - dependency-name: "@systemfsoftware/oxlint-config-recommended"
      - dependency-name: "@systemfsoftware/oxlint-plugin-cell-architecture"
      - dependency-name: "@systemfsoftware/oxlint-plugin-dmmf-workflow"
      - dependency-name: "@systemfsoftware/oxlint-plugin-effect-platform"
      - dependency-name: "@systemfsoftware/oxlint-plugin-effect-schema"
      - dependency-name: "@systemfsoftware/oxlint-plugin-test-discipline"
      - dependency-name: "@systemfsoftware/stryker-framework-interface"
      - dependency-name: "@systemfsoftware/stryker-ignorer-effect-schema-declarations"
      - dependency-name: "@systemfsoftware/stryker-ignorer-interface"
      - dependency-name: "@systemfsoftware/stryker-ignorer-kit"
      - dependency-name: "@systemfsoftware/stryker-js"
      - dependency-name: "@systemfsoftware/stryker-js-cli-contract"
      - dependency-name: "@systemfsoftware/stryker-js-html-reporter"
      - dependency-name: "@systemfsoftware/stryker-js-instrumenter"
      - dependency-name: "@systemfsoftware/stryker-js-plugin-interface"
      - dependency-name: "@systemfsoftware/stryker-js-plugin-runtime"
      - dependency-name: "@systemfsoftware/stryker-js-typescript-checker"
      - dependency-name: "@systemfsoftware/stryker-js-vitest-runner"
      - dependency-name: "@systemfsoftware/stryker-js-vm-runner"
      - dependency-name: "@systemfsoftware/trace-spec"
      - dependency-name: "@systemfsoftware/trace-taxonomy"
      - dependency-name: "@systemfsoftware/tsconfig"
      - dependency-name: "@systemfsoftware/vitest"
    groups:
      oxlint-minor-patch:
        patterns:
          - "oxlint"
          - "@oxlint/*"
        update-types: ["minor", "patch"]
      oxlint-major:
        patterns:
          - "oxlint"
          - "@oxlint/*"
        update-types: ["major"]
      effect-minor-patch:
        patterns:
          - "@effect/*"
          - "effect"
        update-types: ["minor", "patch"]
      effect-major:
        patterns:
          - "@effect/*"
          - "effect"
        update-types: ["major"]
      turborepo-minor-patch:
        patterns:
          - "turbo"
        update-types: ["minor", "patch"]
      testing-minor-patch:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types: ["minor", "patch"]
      testing-major:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types: ["major"]
      commitlint-minor-patch:
        patterns:
          - "@commitlint/*"
        update-types: ["minor", "patch"]
      typescript-minor-patch:
        patterns:
          - "typescript"
        update-types: ["minor", "patch"]
      types-node-minor-patch:
        patterns:
          - "@types/node"
        update-types: ["minor", "patch"]
      types-node-major:
        patterns:
          - "@types/node"
        update-types: ["major"]
      other-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          - "oxlint"
          - "@oxlint/*"
          - "@effect/*"
          - "@commitlint/*"
          - "typescript"
          - "@types/node"
        update-types: ["minor", "patch"]
      major-updates:
        patterns: ["*"]
        exclude-patterns:
          - "oxlint"
          - "@oxlint/*"
          - "@commitlint/*"
          - "typescript"
          - "@types/node"
        update-types: ["major"]

  - package-ecosystem: "nix"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
