name: Release gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan · mutation shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.publish.outputs.matrix }}
      has-shards: ${{ steps.publish.outputs.has-shards }}
      scope: ${{ steps.projects.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: List the files the pull request changes
        if: github.event_name == 'pull_request'
        run: mkdir -p .cache && git diff --name-only HEAD^1 HEAD > .cache/changed-files.txt
      - name: Discover mutation projects
        uses: ./.github/actions/sandbox
        with:
          hosts: |
            jsr.io
            registry.npmjs.org
          command: >-
            deno run --config=scripts/deno.json --allow-read --allow-write --allow-env=MUTATION_SCOPE
            scripts/stryker-plan-gate.ts projects --changed .cache/changed-files.txt
            --out .cache/mutation-projects.txt --scope-out .cache/mutation-scope.txt
      - id: projects
        name: Publish the project list and the mutation scope
        run: |
          echo "projects=$(cat .cache/mutation-projects.txt)" >> "$GITHUB_OUTPUT"
          echo "scope=$(cat .cache/mutation-scope.txt)" >> "$GITHUB_OUTPUT"
      - name: Plan mutation shards
        if: steps.projects.outputs.projects != ''
        uses: ./.github/actions/sandbox
        env:
          MUTATION_PROJECTS: ${{ steps.projects.outputs.projects }}
          MUTATION_SCOPE: ${{ steps.projects.outputs.scope }}
        with:
          hosts: |
            jsr.io
            registry.npmjs.org
          pass-env: |
            MUTATION_PROJECTS
            MUTATION_SCOPE
          command: ./node_modules/.bin/stryker plan --target-seconds 900 --projects "$MUTATION_PROJECTS" --out stryker-plan.json
      - name: Gate the plan
        uses: ./.github/actions/sandbox
        with:
          hosts: |
            jsr.io
            registry.npmjs.org
          command: >-
            deno run --config=scripts/deno.json --allow-read --allow-write --allow-env=MUTATION_SCOPE
            scripts/stryker-plan-gate.ts gate --plan stryker-plan.json --changed .cache/changed-files.txt
            --out .cache/mutation-plan.out
      - id: publish
        name: Publish the plan
        run: cat .cache/mutation-plan.out >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stryker-plan
          path: stryker-plan.json
          if-no-files-found: ignore

  mutation:
    name: mutation · shard ${{ matrix.shard }}
    needs: [plan]
    if: needs.plan.outputs.has-shards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI: "true"
      MUTATION_SCOPE: ${{ needs.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Download the shard plan
        uses: actions/download-artifact@v6
        with:
          name: stryker-plan
          path: .
      - name: Stryker incremental cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v6
        with:
          path: |
            packages/*/reports/stryker-incremental.json
            reports/shards/**/stryker-incremental.json
          key: stryker-shard-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: stryker-shard-${{ matrix.shard }}-
      - name: Mutation at break 100
        uses: ./.github/actions/sandbox
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
        with:
          pass-env: |
            GITHUB_ACTIONS
            MUTATION_SHARD
            MUTATION_SCOPE
          command: ./node_modules/.bin/stryker run --plan stryker-plan.json --shard "$MUTATION_SHARD"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-shard-${{ strategy.job-index }}
          path: reports/shards/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-report-shard-${{ strategy.job-index }}
          path: packages/*/reports/mutation-report.*
          if-no-files-found: ignore
      - name: Print the failed shard's Stryker logs
        if: failure()
        run: .github/scripts/print-log-tails.sh packages/*/stryker.log
      - name: Re-run a failed shard's project runs with their output kept
        if: failure()
        timeout-minutes: 20
        uses: ./.github/actions/sandbox
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
        with:
          pass-env: |
            GITHUB_ACTIONS
            MUTATION_SHARD
            MUTATION_SCOPE
          command: |
            set -uo pipefail
            root="$PWD"
            jq -r --arg shard "$MUTATION_SHARD" \
              '.shards[] | select("\(.index)/\(.count)" == $shard) | .projects[].project' \
              stryker-plan.json > .cache/shard-projects.txt
            while read -r project; do
              out="$root/reports/diagnostics/$project"
              mkdir -p "$out"
              (cd "$project" && timeout --kill-after=30 600 "$root/node_modules/.bin/stryker" run \
                --plan "$root/stryker-plan.json" --shard "$MUTATION_SHARD" --project "$project" \
                --concurrency 1 \
                --progressStreamFile "$out/mutation-stream.jsonl" \
                --incremental --incrementalFile "$out/stryker-incremental.json" \
                > "$out/stdout.log" 2> "$out/stderr.log")
              echo "$project exited $?" | tee "$out/exit.txt"
              "$root/.github/scripts/print-log-tails.sh" \
                "$out/stderr.log" "$out/stdout.log" "$root/$project/stryker.log"
            done < .cache/shard-projects.txt
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-diagnostics-shard-${{ strategy.job-index }}
          path: |
            reports/diagnostics/
            packages/*/stryker.log
          if-no-files-found: ignore

  verdict:
    name: verdict · merged report
    needs: [plan, mutation]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse a plan or a shard that did not finish
        env:
          PLAN: ${{ needs.plan.result }}
          MUTATION: ${{ needs.mutation.result }}
          HAS_SHARDS: ${{ needs.plan.outputs.has-shards }}
        run: |
          if [ "$PLAN" != success ]; then echo "::error::the plan job ended $PLAN"; exit 1; fi
          if [ "$HAS_SHARDS" != true ]; then echo "no mutated file is in this change's scope"; exit 0; fi
          if [ "$MUTATION" != success ]; then echo "::error::a mutation shard ended $MUTATION"; exit 1; fi
      - if: needs.plan.outputs.has-shards == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: needs.plan.outputs.has-shards == 'true'
        uses: ./.github/actions/dev-shell
      - name: Download the shard plan
        if: needs.plan.outputs.has-shards == 'true'
        uses: actions/download-artifact@v6
        with:
          name: stryker-plan
          path: .
      - name: Download every shard's reports
        if: needs.plan.outputs.has-shards == 'true'
        uses: actions/download-artifact@v6
        with:
          pattern: mutation-shard-*
          path: .cache/shard-reports
          merge-multiple: true
      - name: Merge the shard reports and gate them at zero survivors
        if: needs.plan.outputs.has-shards == 'true'
        uses: ./.github/actions/sandbox
        with:
          command: |
            set -euo pipefail
            printf '{"schemaVersion":1,"survivors":[]}\n' > .cache/no-survivors.json
            jq -r '.shards[] | ".cache/shard-reports/\(.index)"' stryker-plan.json > .cache/shard-dirs.txt
            mapfile -t shard_dirs < .cache/shard-dirs.txt
            ./node_modules/.bin/stryker merge --plan stryker-plan.json --out reports/mutation "${shard_dirs[@]}"
            ./node_modules/.bin/stryker gate --baseline .cache/no-survivors.json
      - if: always() && needs.plan.outputs.has-shards == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
