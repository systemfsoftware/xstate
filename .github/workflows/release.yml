name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    name: plan · derive phase
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      phase: ${{ steps.plan.outputs.phase }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Preflight intent consumption
        uses: ./.github/actions/sandbox
        with:
          command: pnpm version -r --dry-run
      - name: Decide release phase from repository state
        uses: ./.github/actions/sandbox
        with:
          hosts: jsr.io
          command: ./scripts/plan-release.ts --output .cache/plan-release.out
      - id: plan
        name: Publish the release phase
        run: cat .cache/plan-release.out >> "$GITHUB_OUTPUT"

  version:
    if: needs.plan.outputs.phase == 'version'
    needs: [plan]
    name: version · open release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Consume pending change intents
        uses: ./.github/actions/sandbox
        with:
          command: pnpm version -r
      - name: Capture release set
        uses: ./.github/actions/sandbox
        with:
          hosts: jsr.io
          command: ./scripts/tag-released-packages.ts --dry-run --json --output .cache/captured.json
      - name: Print the captured release set
        run: cat .cache/captured.json
      - name: Assert release notes
        uses: ./.github/actions/sandbox
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          hosts: |
            jsr.io
            api.github.com
            registry.npmjs.org
          pass-env: |
            GITHUB_TOKEN
            GITHUB_REPOSITORY
          command: ./scripts/create-github-releases.ts --assert --captured .cache/captured.json
      - name: Open or update the Release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: changeset-release/main
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          nix develop --command ./scripts/open-release-pr.sh

  release:
    if: needs.plan.outputs.phase == 'release'
    permissions:
      contents: write
    name: release · tag
    needs: [plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Capture release set
        uses: ./.github/actions/sandbox
        with:
          hosts: jsr.io
          command: ./scripts/tag-released-packages.ts --dry-run --json --output .cache/captured.json
      - name: Assert release notes
        uses: ./.github/actions/sandbox
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          hosts: |
            jsr.io
            api.github.com
            registry.npmjs.org
          pass-env: |
            GITHUB_TOKEN
            GITHUB_REPOSITORY
          command: ./scripts/create-github-releases.ts --assert --captured .cache/captured.json
      - name: Tag released versions
        uses: ./.github/actions/sandbox
        with:
          hosts: jsr.io
          command: ./scripts/tag-released-packages.ts --captured .cache/captured.json --no-push
      - name: Push the released tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          refs=()
          while IFS= read -r tag; do refs+=("refs/tags/$tag"); done < <(nix develop --command jq -r '.[].tag' .cache/captured.json)
          [ "${#refs[@]}" -gt 0 ] || { echo 'no tags to push'; exit 0; }
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" push origin "${refs[@]}"
      - name: GitHub Releases from authored changelogs
        uses: ./.github/actions/sandbox
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          hosts: |
            jsr.io
            api.github.com
            registry.npmjs.org
          pass-env: |
            GITHUB_TOKEN
            GITHUB_REPOSITORY
          command: ./scripts/create-github-releases.ts --captured .cache/captured.json
