name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-intent:
    name: a publishable-package change needs an intent
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Require an intent for every publishable-package change
        uses: ./.github/actions/sandbox
        with:
          command: changeset-management check ${{ github.event.pull_request.base.sha }}
