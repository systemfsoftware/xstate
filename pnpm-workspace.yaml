allowBuilds:
  esbuild: true
  msgpackr-extract: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
catalog:
  "@commitlint/cli": 21.2.3
  "@commitlint/config-conventional": 21.2.3
  "@commitlint/types": 21.2.3
  "@effect/tsgo": 0.68.1
  "@microsoft/api-extractor": 7.59.1
  "@opentelemetry/api": 1.9.1
  "@systemfsoftware/arethetypeswrong-cli": ^4.2.0
  "@systemfsoftware/conformance-spec": ^1.1.4
  "@systemfsoftware/effect-gherkin-spec": ^8.1.4
  "@systemfsoftware/oxlint-config-recommended": ^6.0.1
  "@systemfsoftware/stryker-ignorer-effect-schema-declarations": ^0.3.1
  "@systemfsoftware/stryker-js": ^22.0.0
  "@systemfsoftware/stryker-js-typescript-checker": ^9.0.1
  "@systemfsoftware/stryker-js-vitest-runner": ^10.1.0
  "@systemfsoftware/tsconfig": ^2.1.0
  "@systemfsoftware/vitest": ^4.1.1
  "@testing-library/react": 16.3.3
  "@types/node": 24.19.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  effect: 4.1.4
  fast-check: 4.9.0
  lint-staged: 17.6.0
  oxlint: ~1.90.0
  oxlint-tsgolint: 7.0.2005
  react: 19.3.0
  react-dom: 19.3.0
  rimraf: 6.1.3
  tsdown: 0.23.0
  turbo: 2.11.7
  typescript: 7.0.2
  vitest: 5.0.3
catalogMode: prefer
catalogs:
  peers:
    effect: ^4.1.0
    fast-check: ^4
    react: ^19.3.0
    vitest: ^5
ignoreScripts: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
  - effect-agent
  - "@effect-agent/*"
  - "@systemfsoftware/*"
verifyDepsBeforeRun: warn
overrides:
  "@effect/tsgo": "catalog:"
  effect: "catalog:"
packages:
  - packages/*
supportedArchitectures:
  os: [linux, darwin]
  cpu: [x64, arm64]
  libc: [glibc]
